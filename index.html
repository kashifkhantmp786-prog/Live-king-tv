var v=document.getElementById('v');
var gJ=document.getElementById('g-jazz'), gP=document.getElementById('g-ptv'), gI=document.getElementById('g-ind');
var hls=null;
function makeCard(ch){
  var d=document.createElement('div');d.className='c';
  d.innerHTML='<img src="'+ch.l+'" onerror="this.src=\'https://via.placeholder.com/75x55/fff/000?text='+ch.n.charAt(0)+'\'"><p>'+ch.n+'</p>';
  d.onclick=function(){play(ch.u,d)};
  return d;
}
function render(){
  gJ.innerHTML=''; gP.innerHTML=''; gI.innerHTML='';
  JAZZ.forEach(function(c){gJ.appendChild(makeCard(c))});
  PTV.forEach(function(c){gP.appendChild(makeCard(c))});
  INDIAN.forEach(function(c){gI.appendChild(makeCard(c))});
}
function play(url,el){
  document.querySelectorAll('.c').forEach(function(x){x.classList.remove('active')});
  if(el)el.classList.add('active');
  if(hls){hls.destroy();hls=null;}
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.muted=false;v.play();});}
  else{v.src=url;v.play();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function filt(){
  var q=document.getElementById('q').value.toLowerCase();
  var all=[...JAZZ,...PTV,...INDIAN];
  gJ.innerHTML=''; gP.innerHTML=''; gI.innerHTML='';
  if(q==""){render();return;}
  all.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1}).forEach(function(c){gI.appendChild(makeCard(c))});
}
