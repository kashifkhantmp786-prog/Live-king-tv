</style></head>
<body>

<a class="b t" href="https://t.me/khantipstrick" target="_blank">✈️ Telegram</a>
</div>
<video id="v" controls muted autoplay playsinline></video>

<script>
var SPORTS=[
{n:"Ten Sports HD",l:"https://i.imgur.com/8Km9tLL.png",u:"https://cdn4aws.tamashaweb.com/out/v1/fae477677d214561b1601c23c95fe20a/index.m3u8"},
{n:"ASIA CUP LIVE",l:"https://i.imgur.com/8Km9tLL.png",u:"https://cdn2aws.tamashaweb.com/out/v1/bbe6ba6d0d1c47fbb8042a49b64db630/index.m3u8"},
{n:"EPL Live",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/TMSH-1724158879315.webp?id=28",u:"https://cdn06khi.tamashaweb.com:8087/YlUHeDQb7a/EPL-A-abr/playlist.m3u8"}
];
var PAK=[
{n:"PTV Sports",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/1750321954030.webp?id=31",u:"https://cdn21lhr.tamashaweb.com:8087/jazzauth/PTVSports-abr/playlist.m3u8"},
{n:"Madni Channel",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/madani-channel-live.webp?id=59",u:"https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/Madni-abr/playlist.m3u8"},
{n:"Makkah Live",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/saudi-quran-makkah-tv-hd-live.webp?id=43",u:"https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/Saudimakkah(nw)-abr/playlist.m3u8"},
{n:"GNN",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/gnn-live.webp?id=68",u:"https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/GNN-abr/playlist.m3u8"},
{n:"City 42",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/city-42-live.webp?id=97",u:"https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/city42(vnw)-abr/playlist.m3u8"}
];
var INDIA=[
{n:"Aaj Tak",l:"https://i.imgur.com/Qp6mE9y.png",u:"https://aajtaklive-amd.akamaized.net/hls/live/2014416/aajtak/aajtaklive/live_720p/chunks.m3u8"},
{n:"NDTV India",l:"https://i.imgur.com/mXxQw4K.png",u:"https://ndtvindiaelemarchana.akamaized.net/hls/live/2003679/ndtvindia/ndtvindialive/live_720p/chunks.m3u8"},
{n:"Republic Bharat",l:"https://i.imgur.com/3ZQ3Z9y.png",u:"https://republicworldlive.akamaized.net/hls/live/2016427/republicworldlive/live_720p/chunks.m3u8"},
{n:"Cartoon Network India",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/cartoon-network-live.webp?id=41",u:"https://cdn12isb.tamashaweb.com:8087/YlUHeDQb7a/cartoonnetwork-abr/playlist.m3u8"}
];

var v=document.getElementById('v');
var gS=document.getElementById('g-sports'), gP=document.getElementById('g-pak'), gI=document.getElementById('g-ind');
var hls=null;
function makeCard(ch){
  var d=document.createElement('div');d.className='c';
  d.innerHTML='<img src="'+ch.l+'" onerror="this.src=\'https://via.placeholder.com/75?text=TV\'"><p>'+ch.n+'</p>';
  d.onclick=function(){play(ch.u,d)};
  return d;
}
function render(){
  gS.innerHTML=''; gP.innerHTML=''; gI.innerHTML='';
  SPORTS.forEach(function(c){gS.appendChild(makeCard(c))});
  PAK.forEach(function(c){gP.appendChild(makeCard(c))});
  INDIA.forEach(function(c){gI.appendChild(makeCard(c))});
}
function play(url,el){
  document.querySelectorAll('.c').forEach(function(x){x.classList.remove('active')});
  if(el)el.classList.add('active');
  if(hls){hls.destroy();hls=null;}
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.muted=true;v.play();});}
  else{v.src=url;v.muted=true;v.play();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function filt(){
  var q=document.getElementById('q').value.toLowerCase();
  var all=[...SPORTS,...PAK,...INDIA];
  gS.innerHTML=''; gP.innerHTML=''; gI.innerHTML='';
  if(q==""){render();return;}
  all.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1}).forEach(function(c){
    gS.appendChild(makeCard(c));
  });
}
render();
play(SPORTS[0].u,null);
</script>
</body></html>
