<body>

<script>
var JAZZ=[], PTV=[];
var PTV_FIXED=[

{n:"ASIA CUP",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/1756982709555.webp?id=16",u:"https://cdn2aws.tamashaweb.com/out/v1/bbe6ba6d0d1c47fbb8042a49b64db630/index.m3u8"},
{n:"PTV Sports",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/1750321954030.webp?id=31",u:"https://cdn21lhr.tamashaweb.com:8087/jazzauth/PTVSports-abr/playlist.m3u8"},
{n:"PTV Home",l:"https://canvas.tamashaweb.com/jazzlive/uploads/channels/logo/1750321510303.webp?id=52",u:"https://cdn23lhr.tamashaweb.com:8087/jazzauth/PTVHome-abr/playlist.m3u8"}
];
// AAP KA GITHUB M3U LINK YAHAN DALO - Jo rozana update hota hai
var AUTO_M3U_URL = "https://raw.githubusercontent.com/kashifkhantmp786-prog/Live-king-tv/main/playlist.m3u8";

var v=document.getElementById('v'), status=document.getElementById('status');
var gJ=document.getElementById('g-jazz'), gP=document.getElementById('g-ptv');
var hls=null, ALL=[];

function parseM3U(text){
  var lines=text.split("\n"); var list=[];
  for(var i=0;i<lines.length;i++){
    var l=lines[i];
    if(l.indexOf('tvg-logo=')>-1){
      var a=l.indexOf('tvg-logo="')+10; var b=l.indexOf('"',a);
      var logo=l.substring(a,b); var name=l.split(',').pop().trim();
      var url=(lines[i+1]||'').trim();
      if(url.indexOf('http')==0) list.push({n:name,l:logo,u:url});
    }
  }
  return list;
}
function makeCard(ch){
  var d=document.createElement('div');d.className='c';
  d.innerHTML='<img src="'+ch.l+'" onerror="this.src=\'https://via.placeholder.com/75?text=TV\'"><p>'+ch.n+'</p>';
  d.onclick=function(){play(ch.u,d)};
  return d;
}
function render(){
  gJ.innerHTML=''; gP.innerHTML=''; ALL=[...JAZZ,...PTV_FIXED];
  JAZZ.forEach(function(c){gJ.appendChild(makeCard(c))});
  PTV_FIXED.forEach(function(c){gP.appendChild(makeCard(c))});
  status.innerText="Total: "+ALL.length+" Channels Loaded - Ten Sports Always Works!";
}
function play(url,el){
  document.querySelectorAll('.c').forEach(function(x){x.classList.remove('active')});
  if(el)el.classList.add('active');
  if(hls){hls.destroy();hls=null;}
  status.innerText="Playing: "+(el?el.innerText:"");
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.muted=true;v.play();});hls.on(Hls.Events.ERROR,function(e,d){if(d.fatal){status.innerText="⚠️ Token Expire! Dusra channel try karo!";}});}
  else{v.src=url;v.muted=true;v.play();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function filt(){
  var q=document.getElementById('q').value.toLowerCase();
  gJ.innerHTML=''; gP.innerHTML='';
  if(q==""){render();return;}
  ALL.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1}).forEach(function(c){gJ.appendChild(makeCard(c))});
}
// Try to load auto M3U
fetch(AUTO_M3U_URL).then(function(r){return r.text()}).then(function(t){
  var parsed=parseM3U(t);
  if(parsed.length>0){JAZZ=parsed; status.innerText="Auto M3U Loaded!";} else {JAZZ=[];}
  render(); if(ALL.length>0) play(ALL[0].u,null);
}).catch(function(){
  // Fallback if github link not found
  JAZZ=[

  ];

});
