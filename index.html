function makeCard(ch){

  d.innerHTML='<img src="'+ch.l+'" onerror="this.src=\'https://via.placeholder.com/75?text=TV\'"><p>'+ch.n+'</p>';
  d.onclick=function(){play(ch.u,d)};

function render(){
  gJ.innerHTML=''; gP.innerHTML='';
  JAZZ.forEach(function(c){gJ.appendChild(makeCard(c))});
  PTV.forEach(function(c){gP.appendChild(makeCard(c))});
}
function play(url,el){
  document.querySelectorAll('.c').forEach(function(x){x.classList.remove('active')});
  if(el)el.classList.add('active');
  if(hls){hls.destroy();hls=null;}
  if(Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.muted=true;v.play();});}
  else{v.src=url;v.muted=true;v.play();}
  window.scrollTo({top:0,behavior:'smooth'});
}
function filt(){
  var q=document.getElementById('q').value.toLowerCase();
  var all=[...JAZZ,...PTV];
  gJ.innerHTML=''; gP.innerHTML='';
  if(q==""){render();return;}
  all.filter(function(c){return c.n.toLowerCase().indexOf(q)>-1}).forEach(function(c){gJ.appendChild(makeCard(c))});
}
